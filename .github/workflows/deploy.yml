name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker build \
            --build-arg NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }} \
            --build-arg NEXT_PUBLIC_SOCKET_URL_SERVER=${{ secrets.NEXT_PUBLIC_SOCKET_URL_SERVER }} \
            --build-arg NEXT_PUBLIC_API_AUTH=${{ secrets.NEXT_PUBLIC_API_AUTH }} \
            --build-arg NEXT_PUBLIC_API_USER=${{ secrets.NEXT_PUBLIC_API_USER }} \
            --build-arg NEXT_PUBLIC_API_NETWORK=${{ secrets.NEXT_PUBLIC_API_NETWORK }} \
            --build-arg NEXT_PUBLIC_API_BACKGROUND=${{ secrets.NEXT_PUBLIC_API_BACKGROUND }} \
            --build-arg NEXT_PUBLIC_API_INSTITUTE=${{ secrets.NEXT_PUBLIC_API_INSTITUTE }} \
            --build-arg NEXT_PUBLIC_API_JOB=${{ secrets.NEXT_PUBLIC_API_JOB }} \
            --build-arg NEXT_PUBLIC_API_CONTENT=${{ secrets.NEXT_PUBLIC_API_CONTENT }} \
            -t ${{ secrets.DOCKER_USERNAME }}/pharmainc-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/pharmainc-frontend:latest

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/myapps
            docker-compose pull
            docker-compose up -d